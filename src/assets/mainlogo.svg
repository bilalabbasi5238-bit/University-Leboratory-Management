<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d1210" />
      <stop offset="60%" stop-color="#190a09" />
      <stop offset="100%" stop-color="#0c0505" />
    </radialGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="crimsonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1112" />
      <stop offset="50%" stop-color="#1a0808" />
      <stop offset="100%" stop-color="#0e0404" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>

    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.4" />
    </filter>

    <!-- Circular path for top text -->
    <path id="textCircleTop" d="M 50,200 A 150,150 0 1,1 350,200" fill="none" />
    <!-- Circular path for bottom text -->
    <path id="textCircleBottom" d="M 350,200 A 150,150 0 0,1 50,200" fill="none" />
  </defs>

  <!-- Background Base -->
  <circle cx="200" cy="200" r="194" fill="url(#sealBg)" stroke="url(#goldGradient)" stroke-width="4" />
  <circle cx="200" cy="200" r="186" fill="none" stroke="#7f1d1d" stroke-width="2" opacity="0.8" />
  
  <!-- Outer Decorative Beaded Rim (University Seal Style) -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-dasharray="3, 4" />
  
  <!-- Outer Burgundy Ring -->
  <circle cx="200" cy="200" r="148" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" />
  <circle cx="200" cy="200" r="144" fill="none" stroke="#991b1b" stroke-width="1" />

  <!-- Circular University Name Text -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="700" fill="url(#goldGradient)" letter-spacing="2.2" filter="url(#goldGlow)">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      BENAZIR BHUTTO SHAHEED UNIVERSITY OF TECH &amp; SD
    </textPath>
  </text>

  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="url(#goldGradient)" letter-spacing="3.5" filter="url(#goldGlow)">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      ★ KHAIRPUR · ESTD 2016 ★
    </textPath>
  </text>

  <!-- Inner Seal Medallion -->
  <circle cx="200" cy="200" r="128" fill="url(#shieldBg)" stroke="url(#goldGradient)" stroke-width="2" />
  <circle cx="200" cy="200" r="124" fill="none" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4" />

  <!-- Radiating Starburst / Sunburst Accents -->
  <g stroke="url(#goldGradient)" stroke-width="1" opacity="0.25">
    <line x1="200" y1="76" x2="200" y2="90" />
    <line x1="200" y1="310" x2="200" y2="324" />
    <line x1="76" y1="200" x2="90" y2="200" />
    <line x1="310" y1="200" x2="324" y2="200" />
    <line x1="112" y1="112" x2="122" y2="122" />
    <line x1="288" y1="112" x2="278" y2="122" />
    <line x1="112" y1="288" x2="122" y2="278" />
    <line x1="288" y1="288" x2="278" y2="278" />
  </g>

  <!-- Central Crest / Heraldic Shield -->
  <path d="M 150,130 
           L 250,130 
           Q 256,190 200,246 
           Q 144,190 150,130 Z" 
        fill="url(#crimsonGradient)" 
        stroke="url(#goldGradient)" 
        stroke-width="3" 
        filter="url(#crimsonGlow)" />

  <!-- Shield Inner Border -->
  <path d="M 156,136 
           L 244,136 
           Q 249,188 200,238 
           Q 151,188 156,136 Z" 
        fill="none" 
        stroke="#fef08a" 
        stroke-width="1" 
        opacity="0.6" />

  <!-- Technology Cogwheel / Gear (Upper Center) -->
  <g transform="translate(200, 168)" fill="url(#goldGradient)">
    <!-- Gear teeth -->
    <path d="M -5,-26 L 5,-26 L 4,-20 L -4,-20 Z
             M 18,-18 L 26,-11 L 22,-6 L 15,-13 Z
             M 26,-5 L 26,5 L 20,4 L 20,-4 Z
             M 18,18 L 11,26 L 6,22 L 13,15 Z
             M -5,26 L 5,26 L 4,20 L -4,20 Z
             M -18,18 L -26,11 L -22,6 L -15,13 Z
             M -26,-5 L -26,5 L -20,4 L -20,-4 Z
             M -18,-18 L -11,-26 L -6,-22 L -13,-15 Z" />
    <!-- Gear body -->
    <circle cx="0" cy="0" r="21" fill="url(#goldGradient)" />
    <circle cx="0" cy="0" r="14" fill="#3b1112" />
    <circle cx="0" cy="0" r="7" fill="url(#goldGradient)" />
  </g>

  <!-- Torch of Knowledge & Flame (Emerging through shield) -->
  <g transform="translate(200, 142)">
    <!-- Flame -->
    <path d="M 0,-24 Q 6,-14 6,-8 Q 6,0 0,4 Q -6,0 -6,-8 Q -6,-14 0,-24 Z" fill="#fbbf24" />
    <path d="M 0,-18 Q 3,-11 3,-6 Q 3,-1 0,2 Q -3,-1 -3,-6 Q -3,-11 0,-18 Z" fill="#ffffff" />
    <!-- Torch handle base -->
    <path d="M -4,4 L 4,4 L 2.5,14 L -2.5,14 Z" fill="url(#goldGradient)" />
    <rect x="-6" y="2" width="12" height="3" rx="1.5" fill="#fef08a" />
  </g>

  <!-- Open Book of Knowledge / Skill Development (Lower section of Shield) -->
  <g transform="translate(200, 206)">
    <!-- Left page -->
    <path d="M -2,8 Q -16,-2 -32,2 L -32,-14 Q -16,-18 -2,-10 Z" fill="#ffffff" stroke="url(#goldGradient)" stroke-width="1.5" />
    <!-- Right page -->
    <path d="M 2,8 Q 16,-2 32,2 L 32,-14 Q 16,-18 2,-10 Z" fill="#ffffff" stroke="url(#goldGradient)" stroke-width="1.5" />
    <!-- Spine -->
    <path d="M -2,-10 L 2,-10 L 2,9 L -2,9 Z" fill="#b45309" />
    <!-- Lines on pages (Knowledge) -->
    <line x1="-28" y1="-8" x2="-8" y2="-12" stroke="#991b1b" stroke-width="1" />
    <line x1="-28" y1="-4" x2="-8" y2="-8" stroke="#991b1b" stroke-width="1" />
    <line x1="-28" y1="0" x2="-8" y2="-4" stroke="#991b1b" stroke-width="1" />
    <line x1="8" y1="-12" x2="28" y2="-8" stroke="#991b1b" stroke-width="1" />
    <line x1="8" y1="-8" x2="28" y2="-4" stroke="#991b1b" stroke-width="1" />
    <line x1="8" y1="-4" x2="28" y2="0" stroke="#991b1b" stroke-width="1" />
  </g>

  <!-- Golden Laurel Wreath / Olive Branches framing the shield -->
  <g stroke="url(#goldGradient)" fill="url(#goldGradient)" opacity="0.9">
    <!-- Left laurel leaves -->
    <path d="M 126,160 Q 134,152 142,156 Q 136,166 126,160 Z" />
    <path d="M 120,180 Q 128,172 138,178 Q 130,186 120,180 Z" />
    <path d="M 118,204 Q 128,198 136,206 Q 128,212 118,204 Z" />
    <path d="M 122,228 Q 132,224 138,234 Q 128,238 122,228 Z" />
    <path d="M 134,250 Q 146,248 148,260 Q 138,262 134,250 Z" />
    <path d="M 154,268 Q 166,268 166,280 Q 156,280 154,268 Z" />
    <!-- Branch stem left -->
    <path d="M 132,156 Q 118,214 170,284" fill="none" stroke="url(#goldGradient)" stroke-width="2" />

    <!-- Right laurel leaves -->
    <path d="M 274,160 Q 266,152 258,156 Q 264,166 274,160 Z" />
    <path d="M 280,180 Q 272,172 262,178 Q 270,186 280,180 Z" />
    <path d="M 282,204 Q 272,198 264,206 Q 272,212 282,204 Z" />
    <path d="M 278,228 Q 268,224 262,234 Q 272,238 278,228 Z" />
    <path d="M 266,250 Q 254,248 252,260 Q 262,262 266,250 Z" />
    <path d="M 246,268 Q 234,268 234,280 Q 244,280 246,268 Z" />
    <!-- Branch stem right -->
    <path d="M 268,156 Q 282,214 230,284" fill="none" stroke="url(#goldGradient)" stroke-width="2" />
  </g>

  <!-- Banner Ribbon at the Bottom of Shield -->
  <g transform="translate(200, 276)">
    <!-- Ribbon tails -->
    <path d="M -80,12 L -92,26 L -74,22 L -62,12 Z" fill="#7f1d1d" stroke="url(#goldGradient)" stroke-width="1.2" />
    <path d="M 80,12 L 92,26 L 74,22 L 62,12 Z" fill="#7f1d1d" stroke="url(#goldGradient)" stroke-width="1.2" />
    <!-- Main ribbon center -->
    <path d="M -70,-2 Q 0,-8 70,-2 L 64,16 Q 0,10 -64,16 Z" fill="url(#crimsonGradient)" stroke="url(#goldGradient)" stroke-width="2" filter="url(#goldGlow)" />
    <!-- Text on Ribbon -->
    <text x="0" y="9" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="800" fill="#fef08a" letter-spacing="2">
      BBSUTSD
    </text>
  </g>
</svg>
