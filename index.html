    <script>
      // Defensive initialization: ensure window.fetch has both getter and setter in iframe environments
      (function() {
        try {
          var nativeFetch = window.fetch;
          if (typeof nativeFetch === 'function') {
            var _curFetch = nativeFetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return _curFetch;
                },
                set: function(fn) {
                  _curFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (_err1) {
              try {
                var proto = Object.getPrototypeOf(window);
                if (proto) {
                  Object.defineProperty(proto, 'fetch', {
                    get: function() { return _curFetch; },
                    set: function(fn) { _curFetch = fn; },
                    configurable: true
                  });
                }
              } catch (_err2) {}
            }
          }
        } catch (_e) {}
      })();
    </script>
